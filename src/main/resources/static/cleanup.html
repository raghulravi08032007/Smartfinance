<!DOCTYPE html>
<html>
<head>
    <title>LocalStorage Cleanup</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background: #f5f5f5; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; }
        button { padding: 10px 20px; margin: 5px; background: #e74c3c; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #c0392b; }
        .info { background: #ecf0f1; padding: 10px; margin: 10px 0; border-radius: 4px; }
        pre { background: #2c3e50; color: #ecf0f1; padding: 10px; border-radius: 4px; overflow-x: auto; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧹 LocalStorage Cleanup Tool</h1>
        <div class="info">
            <p><strong>Current localStorage contents:</strong></p>
            <pre id="storage-content"></pre>
        </div>
        
        <h3>Actions:</h3>
        <button onclick="clearTestUser123()">Clear TestUser123 Transactions</button>
        <button onclick="clearTest2User()">Clear Test2User Transactions</button>
        <button onclick="clearAllTransactions()">Clear ALL User Transactions</button>
        <button onclick="viewStorage()">Refresh View</button>
        <button onclick="location.href='index.html'">Back to Home</button>
    </div>
    
    <script>
        function viewStorage() {
            const content = document.getElementById('storage-content');
            let output = '';
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                const value = localStorage.getItem(key);
                output += key + ':\\n' + value + '\\n\\n';
            }
            content.textContent = output || 'No data in localStorage';
        }
        
        function clearTestUser123() {
            localStorage.removeItem('financeTracker.transactions.TestUser123');
            alert('TestUser123 transactions cleared!');
            viewStorage();
        }
        
        function clearTest2User() {
            localStorage.removeItem('financeTracker.transactions.Test2User');
            alert('Test2User transactions cleared!');
            viewStorage();
        }
        
        function clearAllTransactions() {
            const keys = [];
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (key.startsWith('financeTracker.transactions')) {
                    keys.push(key);
                }
            }
            keys.forEach(key => localStorage.removeItem(key));
            alert('All transaction data cleared! (Auth tokens preserved)');
            viewStorage();
        }
        
        // Show storage on load
        viewStorage();
    </script>
</body>
</html>
