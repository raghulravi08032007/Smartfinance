# Application Configuration
spring.application.name=finance-tracker-application
server.port=8080

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/finance_tracker_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=SAIAJAY@2005
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool Configuration
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.open-in-view=false

# JWT Configuration
# Secret key for JWT signing (HMAC-SHA256)
# IMPORTANT: Change this in production! Minimum 256 bits (32 characters) required
jwt.secret=your_jwt_secret_key_change_this_in_production_minimum_256_bits_for_security

# Access token expiration time in milliseconds
# Default: 86400000 ms = 24 hours
jwt.expiration=86400000

# Refresh token expiration time in milliseconds
# Default: 604800000 ms = 7 days
# Refresh tokens are used to obtain new access tokens without re-authentication
jwt.refresh.expiration=604800000

# Security Configuration
# BCrypt password encoding strength (default: 12, range: 4-31)
# Higher values = more secure but slower (2^strength rounds)
app.security.bcrypt-strength=12

# CORS Configuration for Frontend Integration
# Comma-separated list of allowed origins
# Development: Add your frontend dev server URLs
# Production: Add your production domain(s)
app.cors.allowed-origins=http://localhost:3000,http://localhost:8080,http://127.0.0.1:5500,http://127.0.0.1:8080

# Password Reset Token Configuration
password.reset.token.expiration.hours=24
password.reset.max.requests.per.hour=3

# Support Ticket Configuration
support.ticket.auto-close.days=30

# Logging Configuration
logging.level.root=INFO
logging.level.com.rawgul=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.file.name=logs/application.log
logging.file.max-size=10MB
logging.file.max-history=30

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics,auditevents
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true

# Application Info
info.app.name=Finance Tracker
info.app.description=A comprehensive personal finance tracking application
info.app.version=1.0.0
info.app.encoding=UTF-8
info.app.java.version=21.0.9

# Tomcat Configuration
server.tomcat.max-threads=200
server.tomcat.max-connections=10000
server.tomcat.accept-count=100
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain

# Error Handling
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=on_param
server.error.include-exception=false
server.error.whitelabel.enabled=false

# Validation Messages
spring.messages.basename=messages
spring.messages.encoding=UTF-8

# File Upload (if needed in future)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Scheduling
spring.task.scheduling.pool.size=5

# Async Configuration
spring.task.execution.pool.core-size=5
spring.task.execution.pool.max-size=10
spring.task.execution.pool.queue-capacity=100

# Email Configuration (SMTP)
# For Gmail: Use app-specific password if 2FA is enabled
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your_email@gmail.com
spring.mail.password=your_app_specific_password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Email Sender Configuration
app.email.from=noreply@financetracker.com
app.email.fromName=Finance Tracker Team
app.email.support=support@financetracker.com

# Thymeleaf Configuration for Email Templates
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# DevTools Configuration - Disable LiveReload to prevent auto-refresh
spring.devtools.livereload.enabled=false
spring.devtools.restart.enabled=false

# File Upload Configuration
file.upload.dir=uploads
file.upload.max-size=10485760
file.upload.allowed-types=image/jpeg,image/png,image/gif,application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document

# Spring Multipart Configuration (update existing values if present above)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.file-size-threshold=2MB
